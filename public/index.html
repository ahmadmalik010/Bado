<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆڕی کۆمەڵایەتی - دۆزینەوە</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f4f4; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #login-screen, #edit-profile-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; gap: 12px; background: #fff; padding: 20px; position: fixed; top: 0; left: 0; width: 100%; z-index: 10; overflow-y: auto; }
        #edit-profile-screen { display: none; background: rgba(0,0,0,0.5); }
        .modal-box { background: #fff; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 320px; }
        
        input, select, textarea, .file-upload-label { padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; background: #fff; text-align: center; color: #555; }
        .file-upload-label { background: #f0f0f0; border: 1px dashed #ea266e; color: #ea266e; font-weight: bold; cursor: pointer; display: block; }
        input[type="file"] { display: none; }

        button { padding: 10px 20px; width: 100%; background: #ea266e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }

        #chat-screen { display: none; width: 100%; height: 100vh; flex-direction: column; background: #f9f9f9; }
        
        .app-header { background: #ea266e; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .app-header button { width: auto; background: white; color: #ea266e; font-size: 12px; padding: 6px 12px; }

        .discovery-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        
        .swipe-card { background: white; width: 100%; max-width: 320px; height: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: absolute; }
        .swipe-card img { width: 100%; height: 260px; object-fit: cover; }
        .swipe-card .card-info { padding: 15px; display: flex; flex-direction: column; gap: 5px; flex: 1; text-align: center; }
        .swipe-card .card-info h3 { font-size: 18px; color: #333; }
        .swipe-card .card-info .status-badge { color: #ea266e; font-size: 13px; font-weight: bold; }
        .swipe-card .card-info p { font-size: 13px; color: #666; }

        .action-buttons { display: flex; gap: 15px; width: 100%; max-width: 320px; margin-top: 20px; z-index: 5; }
        .action-buttons button { flex: 1; padding: 12px; border-radius: 25px; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #skip-btn { background: #fff; color: #777; border: 1px solid #ddd; }
        #like-btn { background: #ea266e; color: #fff; }

        /* پەنجەرەی چات */
        #chat-box-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #fff; z-index: 20; flex-direction: column; }
        .chat-header { background: #ea266e; color: white; padding: 15px; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        #messages { list-style: none; flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        
        #messages li { background: #ffffff; padding: 10px 14px; border-radius: 10px; max-width: 75%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-size: 14px; }
        #messages li.my-msg { background: #ffe6ef; margin-right: auto; }
        #messages li.other-msg { background: #fff; }
        
        .chat-img-msg { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 5px; display: block; }

        #form { background: #fff; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #ddd; align-items: center; }
        #input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; text-align: right; }
        
        .chat-img-btn { background: #f0f0f0; color: #ea266e; border: 1px solid #ea266e; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; }
        #form button[type="submit"] { width: auto; background: #ea266e; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>دۆزینەوەی هاوڕێ</h2>
        <input id="username-input" placeholder="ناوی خۆت..." autocomplete="off" />
        <input id="age-input" type="number" placeholder="تەمەنت..." />
        <textarea id="bio-input" placeholder="دەربارەی خۆت (Bio)..." rows="2"></textarea>
        
        <select id="status-input">
            <option value="سینگڵ (Single)">سینگڵ (Single)</option>
            <option value="دەزگیران (Engaged)">دەزگیران (Engaged)</option>
            <option value="هاوسەرگیریکردووە (Married)">هاوسەرگیریکردووە (Married)</option>
        </select>

        <label for="avatar-file" class="file-upload-label">وێنەی پرۆفایل هەڵبژێرە 📁</label>
        <input type="file" id="avatar-file" accept="image/*" />

        <button id="login-btn">دەستپێکردن</button>
    </div>

    <!-- پەنجەرەی دەستکاریکردنی پرۆفایل -->
    <div id="edit-profile-screen">
        <div class="modal-box">
            <h3>دەستکاری پرۆفایل</h3>
            <input id="edit-name" placeholder="ناوی نوێ..." />
            <input id="edit-age" type="number" placeholder="تەمەنی نوێ..." />
            <textarea id="edit-bio" placeholder="بایۆی نوێ..." rows="2"></textarea>
            
            <select id="edit-status">
                <option value="سینگڵ (Single)">سینگڵ (Single)</option>
                <option value="دەزگیران (Engaged)">دەزگیران (Engaged)</option>
                <option value="هاوسەرگیریکردووە (Married)">هاوسەرگیریکردووە (Married)</option>
            </select>

            <label for="edit-avatar-file" class="file-upload-label">گۆڕینی وێنە 📁</label>
            <input type="file" id="edit-avatar-file" accept="image/*" />

            <button id="save-profile-btn">پاشەکەوتکردن</button>
            <button id="close-modal-btn" style="background: #777;">پەشیمانبوونەوە</button>
        </div>
    </div>

    <div id="chat-screen">
        <div class="app-header">
            <span>تۆڕی ناسینەوە</span>
            <button id="open-edit-btn">پرۆفایلی من</button>
        </div>

        <div class="discovery-container" id="card-container"></div>

        <div class="action-buttons" id="action-buttons" style="display: none;">
            <button id="skip-btn">بەرەو پێش (✕)</button>
            <button id="like-btn">چاتکردن (❤)</button>
        </div>
    </div>

    <div id="chat-box-modal">
        <div class="chat-header">
            <span id="current-chat-user">چات</span>
            <button id="close-chat-btn" style="width: auto; background: white; color: #ea266e; padding: 4px 10px; font-size: 12px;">گەڕانەوە</button>
        </div>
        <ul id="messages"></ul>
        
        <form id="form">
            <label for="chat-image-input" class="chat-img-btn">وێنە 📷</label>
            <input type="file" id="chat-image-input" accept="image/*" />

            <input id="input" autocomplete="off" placeholder="پەیام..." />
            <button type="submit">ناردن</button>
        </form>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const editProfileScreen = document.getElementById('edit-profile-screen');
        const chatBoxModal = document.getElementById('chat-box-modal');
        
        const usernameInput = document.getElementById('username-input');
        const ageInput = document.getElementById('age-input');
        const bioInput = document.getElementById('bio-input');
        const statusInput = document.getElementById('status-input');
        const avatarFile = document.getElementById('avatar-file');
        const loginBtn = document.getElementById('login-btn');
        
        const editName = document.getElementById('edit-name');
        const editAge = document.getElementById('edit-age');
        const editBio = document.getElementById('edit-bio');
        const editStatus = document.getElementById('edit-status');
        const editAvatarFile = document.getElementById('edit-avatar-file');
        const openEditBtn = document.getElementById('open-edit-btn');
        const saveProfileBtn = document.getElementById('save-profile-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');

        const cardContainer = document.getElementById('card-container');
        const actionButtons = document.getElementById('action-buttons');
        const skipBtn = document.getElementById('skip-btn');
        const likeBtn = document.getElementById('like-btn');
        
        const currentChatUser = document.getElementById('current-chat-user');
        const closeChatBtn = document.getElementById('close-chat-btn');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const chatImageInput = document.getElementById('chat-image-input');
        const messages = document.getElementById('messages');

        let allUsers = [];
        let currentIndex = 0;
        let targetSocketId = null;
        let myAvatarBase64 = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png';

        function convertImage(fileInput, callback) {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { callback(e.target.result); };
                reader.readAsDataURL(file);
            } else {
                callback(null);
            }
        }

        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            const age = ageInput.value.trim();
            const bio = bioInput.value.trim();
            const status = statusInput.value;

            if (name) {
                convertImage(avatarFile, (base64Img) => {
                    if (base64Img) myAvatarBase64 = base64Img;
                    socket.emit('set profile', { name, age, bio, status, avatar: myAvatarBase64 });
                    loginScreen.style.display = 'none';
                    chatScreen.style.display = 'flex';
                });
            } else {
                alert('تکایە ناوێک بنووسە');
            }
        });

        openEditBtn.addEventListener('click', () => {
            editName.value = usernameInput.value;
            editAge.value = ageInput.value;
            editBio.value = bioInput.value;
            editStatus.value = statusInput.value;
            editProfileScreen.style.display = 'flex';
        });

        closeModalBtn.addEventListener('click', () => {
            editProfileScreen.style.display = 'none';
        });

        saveProfileBtn.addEventListener('click', () => {
            const name = editName.value.trim();
            const age = editAge.value.trim();
            const bio = editBio.value.trim();
            const status = editStatus.value;

            if (name) {
                convertImage(editAvatarFile, (base64Img) => {
                    if (base64Img) myAvatarBase64 = base64Img;
                    usernameInput.value = name;
                    ageInput.value = age;
                    bioInput.value = bio;
                    statusInput.value = status;
                    socket.emit('update profile', { name, age, bio, status, avatar: myAvatarBase64 });
                    editProfileScreen.style.display = 'none';
                });
            } else {
                alert('ناو بەتاڵ نەبێت');
            }
        });

        socket.on('update users', (users) => {
            allUsers = users.filter(user => user.id !== socket.id);
            if (currentIndex >= allUsers.length) currentIndex = 0;
            showCurrentCard();
        });

        function showCurrentCard() {
            cardContainer.innerHTML = '';
            if (allUsers.length === 0 || currentIndex >= allUsers.length) {
                cardContainer.innerHTML = `<div style="text-align:center; color:#777;">هیچ کەسێکی تر نییە...</div>`;
                actionButtons.style.display = 'none';
                return;
            }

            actionButtons.style.display = 'flex';
            const user = allUsers[currentIndex];

            const card = document.createElement('div');
            card.className = 'swipe-card';
            card.innerHTML = `
                <img src="${user.avatar}" alt="وێنە">
                <div class="card-info">
                    <h3>${user.name}${user.age ? ', ' + user.age : ''}</h3>
                    <div class="status-badge">${user.status || ''}</div>
                    <p>${user.bio ? user.bio : 'هیچ بایۆیەک نییە'}</p>
                </div>
            `;
            cardContainer.appendChild(card);
        }

        skipBtn.addEventListener('click', () => {
            currentIndex++;
            showCurrentCard();
        });

        likeBtn.addEventListener('click', () => {
            if (allUsers.length > 0 && currentIndex < allUsers.length) {
                const user = allUsers[currentIndex];
                targetSocketId = user.id;
                currentChatUser.textContent = `چات لەگەڵ: ${user.name}`;
                messages.innerHTML = '';
                chatBoxModal.style.display = 'flex';
            }
        });

        closeChatBtn.addEventListener('click', () => {
            chatBoxModal.style.display = 'none';
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (targetSocketId) {
                if (input.value.trim()) {
                    const msgText = input.value;
                    socket.emit('private message', { to: targetSocketId, msg: msgText, type: 'text' });
                    appendMessage(msgText, 'text', 'my-msg');
                    input.value = '';
                }

                const file = chatImageInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const base64Img = e.target.result;
                        socket.emit('private message', { to: targetSocketId, msg: base64Img, type: 'image' });
                        appendMessage(base64Img, 'image', 'my-msg');
                        chatImageInput.value = '';
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        socket.on('private message', (data) => {
            if (data.senderId === targetSocketId) {
                appendMessage(data.msg, data.type, 'other-msg');
            }
        });

        function appendMessage(content, type, className) {
            const item = document.createElement('li');
            item.className = className;

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = content;
                img.className = 'chat-img-msg';
                item.appendChild(img);
            } else {
                item.textContent = content;
            }

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
